name: Validate Submission
on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches:
      - main
    paths:
      - 'model-output/**.parquet'
      - 'model-metadata/*'
      - '!**README**'

jobs:
    validates-files:
        runs-on: ubuntu-latest

        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
        - name: Checkout repository
          uses: actions/checkout@v6
          with:
            ref: ${{ github.event.pull_request.head.sha }}
            fetch-depth: 1
            sparse-checkout: |
              .github/
              src
              hub-config
              model-output/
              model-metadata/

        - name: Setup R
          uses: r-lib/actions/setup-r@v2

        - name: Install system dependencies
          run: sudo apt-get install libcurl4-openssl-dev libudunits2-dev libgdal-dev

        - name: Cache R packages
          id: cache
          uses: actions/cache@v4
          with:
            path: ${{ env.R_LIBS_USER }}
            key: ${{ runner.os }}-${{ hashFiles('.github/requirements.txt') }}-1

        - name: Install dependencies
          if: steps.cache.outputs.cache-hit != 'true'
          run: |
            R -e 'Sys.setenv("NOT_CRAN" = TRUE)
                  install.packages(c("arrow", "gh", "remotes"))
                  Sys.unsetenv("NOT_CRAN")
                  remotes::install_url("https://github.com/midas-network/SMHvalidation/archive/refs/heads/main.zip")'
          env:
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

        - name: Run Validation - Open/reopen
          id: validation_open
          if: ( github.event.action != 'synchronize' )
          continue-on-error: true
          run: |
            R -e 'source("src/validation.R")
                  pr_validate(Sys.getenv("GITHUB_REPOSITORY"),
                              Sys.getenv("GH_PR_NUMBER"), "", ".",
                              Sys.getenv("GH_TOKEN"))'

        - name: Run Validation - Synchronize
          id: validation_sync
          if: ( github.event.action == 'synchronize' )
          continue-on-error: true
          run: |
            R -e 'source("src/validation.R")
                  pr_validate(Sys.getenv("GITHUB_REPOSITORY"),
                              Sys.getenv("GH_PR_NUMBER"),
                              Sys.getenv("GH_COMMIT_SHA"), ".",
                              Sys.getenv("GH_TOKEN"))'
          env:
            GH_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

        - name: Record which PR this belongs to
          if: always()
          run: |
            echo "${{ github.event.pull_request.number }}" > pr_number.txt

        - name: Upload result as artifact
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: pr-comment
            path: |
              comment.txt
              pr_number.txt
            retention-days: 1

        - name: Fail if error in validation
          if: steps.validation_open.outcome == 'failure' || steps.validation_sync.outcome == 'failure'
          run: exit 1
